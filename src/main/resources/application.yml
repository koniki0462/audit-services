# Shared settings. Profiles mirror the front end's environments: dev (default), staging, prod.
server:
  port: ${PORT:4000}
  servlet:
    context-path: /api
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: audit-service
  profiles:
    default: dev
  # Flyway is the only thing that creates or changes the schema, in every profile: Hibernate just checks the
  # entities against it, and schema.sql / data.sql scripts are never run. SchemaManagedByFlywayTest guards this.
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  docker:
    compose:
      # Only the dev profile starts the local PostgreSQL container (spring-boot-docker-compose).
      enabled: false
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    # Comma-separated list of front-end origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # HMAC key for signing access tokens, at least 32 bytes. Required outside dev; startup fails without it.
    secret: ${JWT_SECRET}
    # How long an access token is valid, e.g. 8h or 30m
    ttl: ${JWT_TTL:8h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
    # Keep the token from "Authorize" across page reloads.
    persist-authorization: true
    try-it-out-enabled: true
    display-request-duration: true
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  # application/problem+json errors are documented by OpenApiConfig instead.
  override-with-generic-response: false

---
# Development: PostgreSQL in Docker (the `db` service in docker-compose.yml), loaded with the same sample data
# as the front end's test fixtures. On startup spring-boot-docker-compose runs `docker compose up` for `db` and
# connects to it, overriding the datasource below. Run with SPRING_DOCKER_COMPOSE_ENABLED=false to use the
# datasource below against a database you manage yourself.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/audit}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  docker:
    compose:
      enabled: true
      # Keep the container (and its data) running between restarts; `docker compose down` stops it.
      lifecycle-management: start-only
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-staging-or-prod}

---
# Staging and production: PostgreSQL, configured from the environment.
spring:
  config:
    activate:
      on-profile: staging | prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
