# Shared settings. Profiles mirror the front end's environments: dev (default), staging, prod.
server:
  port: ${PORT:4000}
  servlet:
    context-path: /api
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: audit-service
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    # Comma-separated list of front-end origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

---
# Development: in-memory H2 (PostgreSQL mode) loaded with the same sample data as the front end's mock data.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:auditdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Staging and production: PostgreSQL, configured from the environment.
spring:
  config:
    activate:
      on-profile: staging | prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
