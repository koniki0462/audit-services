# Local PostgreSQL for development, and optionally the service itself.
#
#   mvn spring-boot:run                      starts `db` automatically (spring-boot-docker-compose), dev profile
#   docker compose up -d db                  start just the database yourself
#   docker compose --profile app up --build  database + the service in a container, staging profile
#   docker compose down -v                   stop and wipe the database (dev re-seeds on the next start)
#
# The API is at http://localhost:4000/api. The database is published on localhost:5432; if another PostgreSQL
# already uses that port, stop it or set DB_HOST_PORT to a free one.
services:
  db:
    image: postgres:16-alpine
    environment:
      # Only applied when the volume is first created; after changing these run `docker compose down -v`.
      POSTGRES_DB: audit
      POSTGRES_USER: ${DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d audit"]
      interval: 5s
      retries: 10

  audit-service:
    # Only started with --profile app, so `docker compose up` and Spring Boot's auto-start run just the database.
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-staging}
      DB_URL: jdbc:postgresql://db:5432/audit
      DB_USERNAME: ${DB_USERNAME:-myuser}
      DB_PASSWORD: ${DB_PASSWORD:-mypassword}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Local default only. Real deployments must set their own random secret of 32+ bytes.
      JWT_SECRET: ${JWT_SECRET:-compose-local-only-jwt-secret-change-me}
    ports:
      - "4000:4000"

volumes:
  pgdata:
