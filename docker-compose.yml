# Runs the service against PostgreSQL, close to staging and production.
#   docker compose up --build
# The API is then at http://localhost:4000/api
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-audit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      retries: 10

  audit-service:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-staging}
      DB_URL: jdbc:postgresql://db:5432/audit
      DB_USERNAME: audit
      DB_PASSWORD: ${DB_PASSWORD:-audit}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "4000:4000"

volumes:
  pgdata:
